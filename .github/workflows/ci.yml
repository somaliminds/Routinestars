name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Reasonable defaults — every job runs Ubuntu, Node 20, with npm cache
# pinned to the apps/mobile lockfile so cold cache reads are quick.
defaults:
  run:
    working-directory: apps/mobile

jobs:
  # Typecheck + lint + tests — the same gates we run locally before commit.
  # Each step uses --max-warnings 0 (lint) and --silent (jest) to keep
  # signal high; a real failure is the only thing that prints.
  test:
    name: Typecheck · Lint · Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint (max-warnings 0)
        run: npm run lint

      - name: Jest unit tests
        run: npm test -- --silent --ci

  # Surface high/critical production vulnerabilities. Dev-dep noise (Jest,
  # Babel, etc.) is excluded by --omit=dev. Fail the build on any high+.
  audit:
    name: npm audit (production deps, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --omit=optional
      - name: Audit production dependencies (high+)
        run: npm audit --audit-level=high --omit=dev

  # Detect committed secrets BEFORE they reach origin/main. Scans the diff
  # vs the default branch on PRs, full history on push.
  secrets-scan:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.78.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          # --only-verified means we only fail on CONFIRMED live secrets
          # (e.g. real Stripe key that authenticates against the API).
          # Cuts false-positive noise from API-key-looking strings.
          extra_args: --only-verified
